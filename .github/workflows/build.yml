name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Read only by default. The publish job asks for the OIDC token it needs itself.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: ${{ matrix.os }}
    # Windows covers FileSystemStorage on NTFS: file names, case-insensitivity, and replacing files that are open.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The tag is the version: tag 1.2.3 (or v1.2.3) builds 1.2.3. Other builds use the Version in
      # src/Directory.Build.props.
      - name: Resolve the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION_ARGUMENT=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        # Packs as a side effect (GeneratePackageOnBuild), populating ./nugets.
        run: dotnet build src --configuration Release ${{ env.VERSION_ARGUMENT }}

      # TUnit runs on Microsoft.Testing.Platform: run the test executable rather than `dotnet test`.
      - name: Test
        run: >-
          dotnet run --project src/OfficeHost.Tests --configuration Release --no-build --
          --report-trx --results-directory ${{ github.workspace }}/TestResults
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          --coverage-settings ${{ github.workspace }}/src/coverage.config

      # On LocalDB, which the Windows runners have: skipped on Ubuntu.
      - name: Test SQL Server
        run: >-
          dotnet run --project src/OfficeHost.SqlServer.Tests --configuration Release --no-build --
          --report-trx --results-directory ${{ github.workspace }}/TestResults

      - name: Coverage
        shell: pwsh
        run: ./src/coverage-summary.ps1 TestResults/coverage.cobertura.xml -Summary $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

      # A changed Verify snapshot fails the run and leaves a .received file to compare with the .verified one.
      - name: Upload received snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received-snapshots-${{ matrix.os }}
          path: '**/*.received.*'
          if-no-files-found: ignore

      # The package is the same on both: publish the Linux one.
      - name: Upload packages
        if: success() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: nugets/OfficeHost.*.nupkg
          if-no-files-found: error
          retention-days: 30

  # Microsoft's WOPI validator against the endpoints, see src/wopi-validator.ps1.
  wopi-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build src/OfficeHost.E2ETests --configuration Release

      - name: WOPI validator
        shell: pwsh
        run: ./src/wopi-validator.ps1 -Configuration Release

  # Trusted publishing: no stored API key. nuget.org validates GitHub's OIDC token against the policy naming this
  # repository and this workflow file, and returns a key good for an hour.
  publish:
    needs: [build, wopi-validator]
    environment: nuget
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: SimonCropp

      - name: Push to nuget.org
        run: >
          dotnet nuget push "packages/**/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
