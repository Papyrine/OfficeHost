name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: ${{ matrix.os }}
    # Windows covers FileSystemStorage on NTFS: file names, case-insensitivity, and replacing files that are open.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build src --configuration Release

      # TUnit runs on Microsoft.Testing.Platform: run the test executable rather than `dotnet test`.
      - name: Test
        run: >-
          dotnet run --project src/WopiServer.Tests --configuration Release --no-build --
          --report-trx --results-directory ${{ github.workspace }}/TestResults
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          --coverage-settings ${{ github.workspace }}/src/coverage.config

      - name: Coverage
        shell: pwsh
        run: ./src/coverage-summary.ps1 TestResults/coverage.cobertura.xml -Summary $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

      # A changed Verify snapshot fails the run and leaves a .received file to compare with the .verified one.
      - name: Upload received snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received-snapshots-${{ matrix.os }}
          path: '**/*.received.*'
          if-no-files-found: ignore

  # Microsoft's WOPI validator against the endpoints, see src/wopi-validator.ps1.
  wopi-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build src/WopiServer.E2ETests --configuration Release

      - name: WOPI validator
        shell: pwsh
        run: ./src/wopi-validator.ps1 -Configuration Release
